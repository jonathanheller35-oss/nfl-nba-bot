name: Run bot

on:
  schedule:
    - cron: "0 14 * * *"
    - cron: "0 23 * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run bot
        run: |
          python bot.py

      - name: Upload chart
        uses: actions/upload-artifact@v4
        with:
          name: charts
          path: test_chart.png
